# ZEN Local Development Stack
#
# Run:  docker compose up -d
# Stop: docker compose down
#
# The backend connects to Postgres and exposes the API on port 8080.

services:
  # ZEN Go backend service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: 0.1.0-dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_DSN: "postgres://zen:zen@db:5432/zen?sslmode=disable"
      DB_RUN_MIGRATIONS: "true"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "5m"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: development
      SENTRY_SAMPLE_RATE: "0.1"
      SERVER_READ_TIMEOUT: "10s"
      SERVER_WRITE_TIMEOUT: "10s"
      SERVER_SHUTDOWN_TIMEOUT: "15s"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Postgres database.
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: zen
      POSTGRES_DB: zen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen -d zen"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
